[project]
name = "wrfdb-bot"
version = "0.1.0"
description = "Discord bot for War Robots: Frontiers data from WRFrontiersDB"
requires-python = ">=3.11"
dependencies = [
    "discord.py==2.7.1",
    "python-dotenv==1.2.4",
    "loguru==0.7.3",
    "RapidFuzz==3.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
